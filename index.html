<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A1810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Моторика">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Моторика — Гараж в кармане</title>
<style>
:root{--mu:#E2A524;--ra:#B5124F;--br:#2A1810;--br2:#3D2418;--tx:#F6EBDD;--ok:#6fbf8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--br)}
body{color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior-y:none}
header{position:sticky;top:0;z-index:5;background:var(--br);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #4b2f20}
header img{width:36px;height:36px;border-radius:10px}
.t{font-weight:800;font-size:19px}.t i{color:var(--mu);font-style:normal}
#cs{margin-left:auto;max-width:48%;font-size:16px;padding:8px 10px;border-radius:12px;border:2px solid #6b4a36;background:var(--br2);color:var(--tx)}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto}
.tab{display:none}.tab.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:24px;line-height:1.15;margin:4px 0 8px}h3{font-size:18px;margin:0 0 12px}p{margin:0 0 10px;color:#d9c7b4}
.card{background:var(--br2);border-radius:22px;padding:18px;margin-bottom:14px}
.hero{background:linear-gradient(150deg,#4a2a1c,var(--br2))}
.hero small{color:var(--mu);font-weight:700}
.km{font-size:40px;font-weight:800;color:var(--mu);margin:2px 0}
form{display:grid;gap:10px;margin-top:12px}
input,select{font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;border:2px solid #6b4a36;background:#2e1a11;color:var(--tx);width:100%}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--ra);outline-offset:2px}
label{display:grid;gap:5px;font-size:14px;color:#d9c7b4}
.b{background:var(--mu);color:var(--br);border:0;border-radius:999px;padding:14px 22px;font:700 16px inherit;cursor:pointer;width:100%;display:block;text-align:center;text-decoration:none}
.b:active{transform:scale(.98)}
.b.s{background:transparent;color:var(--tx);border:2px solid #6b4a36;margin-top:6px}
.b.sm{width:auto;padding:9px 16px;font-size:14px}
.it{border-left:6px solid #6b4a36;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.it b{display:block}.it span{font-size:14px;color:#d9c7b4}
.it.ok{border-color:var(--ok)}.it.soon{border-color:var(--mu)}.it.bad{border-color:var(--ra);background:#4a1a2a}.it.un{border-color:#6b4a36}
.bad span{color:#ffb3cd;font-weight:700}.soon span{color:var(--mu);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:#1d110b;border-top:1px solid #4b2f20;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;color:#b9a28d;font:600 13px inherit;padding:14px 4px 12px;border-top:3px solid transparent;cursor:pointer}
nav button.on{color:var(--mu);border-top-color:var(--mu)}
.tip{border:2px dashed var(--ra)}
.row{display:flex;gap:8px}.row>*{flex:1}
.x{background:none;border:0;color:#b9a28d;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><span class="t">Мотор<i>ика</i></span><select id="cs" aria-label="Машина"></select></header>
<main>
<section class="tab on" id="t-g"></section>
<section class="tab" id="t-s"></section>
<section class="tab" id="t-f"></section>
<section class="tab" id="t-n"></section>
</main>
<nav id="nv"><button data-t="g" class="on">Гараж</button><button data-t="s">ТО</button><button data-t="f">Штрафы</button><button data-t="n">Рядом</button></nav>
<script>
(function(){
var K="motorika.v1",S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{cars:[],cur:null,fines:[],warn:5,tip:0};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return Math.round(n).toLocaleString("ru-RU")}
var D=864e5;
var CL={cold:["Холодный (зимы до −30)",.8],mid:["Умеренный",1],hot:["Жаркий",.85]};
// ключ, название, интервал км (0 = только по времени), интервал мес., зависит от климата
var IT=[["oil","Масло и масляный фильтр",10000,12,1],["air","Воздушный фильтр",15000,24,1],["cab","Салонный фильтр",15000,12,1],
["plug","Свечи зажигания",30000,48,0],["pad","Тормозные колодки",40000,0,1],["bf","Тормозная жидкость",0,24,0],
["cool","Охлаждающая жидкость",60000,60,1],["belt","Ремень или цепь ГРМ",90000,72,0]];
function cur(){return S.cars.filter(function(c){return c.id===S.cur})[0]}
function mo(c){var d=(Date.now()-c.t0)/D;return d>=14&&c.km>c.km0?Math.round((c.km-c.km0)/d*30.4):c.monthly}
function st(c,it){var s=c.svc[it[0]],f=it[4]?CL[c.cl][1]:1,m=mo(c)||1;
if(!s)return{u:1e12,cls:"un",tx:"Не отмечено: когда делали в последний раз?"};
var rk=it[2]?s.km+it[2]*f-c.km:1e12,rd=it[3]?(s.t+it[3]*30.4*D-Date.now())/D:1e12,rdk=rd>=1e12?1e12:rd*m/30.4,u=Math.min(rk,rdk),tx;
if(u<=0)tx=rk<=rdk?"Просрочено на "+fmt(-rk)+" км":"Просрочено на "+fmt(-rd)+" дн.";
else tx=rk<=rdk?"Через "+fmt(rk)+" км · примерно "+Math.max(1,Math.round(rk/m))+" мес.":"Через "+fmt(rd)+" дн.";
return{u:u,cls:u<=0?"bad":u<=1000?"soon":"ok",tx:tx}}
function rG(){var c=cur(),h="";
if(!c)h+='<div class="card hero"><h2>Гараж в кармане</h2><p>Добавь машину, и приложение подскажет, что и когда менять, с учётом климата и пробега.</p></div>';
else h+='<div class="card hero"><small>'+esc(c.year||"")+'</small><h2>'+esc(c.name)+'</h2><div class="km">'+fmt(c.km)+' км</div><p>Примерно '+fmt(mo(c))+' км в месяц · климат: '+CL[c.cl][0]+'</p><form id="fk"><input name="k" type="number" inputmode="numeric" min="0" placeholder="Новый пробег, км" required><button class="b">Обновить пробег</button></form></div>';
if(!S.tip&&!navigator.standalone&&/iPhone|iPad/.test(navigator.userAgent))h+='<div class="card tip"><h3>Установи как приложение</h3><p>В Safari нажми «Поделиться», затем «На экран “Домой”». Так оно откроется без адресной строки.</p><button class="x" data-a="tip">Скрыть</button></div>';
h+='<div class="card"><h3>'+(c?"Добавить ещё машину":"Новая машина")+'</h3><form id="fa"><label>Марка и модель<input name="n" required maxlength="40" placeholder="Например, Daewoo Lanos"></label><div class="row"><label>Год<input name="y" type="number" inputmode="numeric" min="1950" max="2030" placeholder="2008"></label><label>Пробег, км<input name="k" type="number" inputmode="numeric" min="0" required placeholder="120000"></label></div><div class="row"><label>Км в месяц<input name="m" type="number" inputmode="numeric" min="1" value="1000"></label><label>Климат<select name="c"><option value="cold">Холодный</option><option value="mid" selected>Умеренный</option><option value="hot">Жаркий</option></select></label></div><button class="b">Добавить в гараж</button></form></div>';
if(c)h+='<button class="b s" data-a="delcar">Удалить эту машину</button>';
$("t-g").innerHTML=h}
function rS(){var c=cur();if(!c){$("t-s").innerHTML='<div class="card"><h3>Нет машины</h3><p>Сначала добавь машину в гараже.</p></div>';return}
var L=IT.map(function(it){return{it:it,s:st(c,it)}}).sort(function(a,b){return a.s.u-b.s.u}),
h='<h2>ТО: '+esc(c.name)+'</h2><p>Сроки учитывают климат и твой средний пробег. Предупреждаем за 1000 км и меньше.</p>';
L.forEach(function(r){h+='<div class="card it '+r.s.cls+'"><div><b>'+r.it[1]+'</b><span>'+r.s.tx+'</span></div><button class="b sm" data-a="mark" data-k="'+r.it[0]+'">'+(c.svc[r.it[0]]?"Сделано":"Отметить")+'</button></div>'});
$("t-s").innerHTML=h}
function left(f){return 20-Math.floor((Date.now()-new Date(f.date).getTime())/D)}
function rF(){var h='<h2>Штрафы</h2><p>Скидка 50% действует 20 дней с даты постановления (сверяй срок по самому постановлению). Приложение пока не ищет штрафы само, добавь их вручную.</p>';
S.fines.forEach(function(f){var l=left(f),cls=l<0?"un":l<=S.warn?"bad":"ok",tx=l<0?"Скидка закончилась. Сумма "+fmt(f.sum)+" ₽":"Скидка ещё "+l+" дн. Заплатишь "+fmt(f.sum/2)+" ₽ вместо "+fmt(f.sum)+" ₽";
h+='<div class="card it '+cls+'"><div><b>'+fmt(f.sum)+' ₽ от '+esc(f.date.split("-").reverse().join("."))+'</b><span>'+tx+'</span></div><button class="b sm" data-a="delfine" data-k="'+f.id+'">Оплачено</button></div>'});
if(!S.fines.length)h+='<div class="card"><p>Штрафов нет. Добавь первый ниже.</p></div>';
h+='<div class="card"><h3>Добавить штраф</h3><form id="ff"><label>Сумма, ₽<input name="s" type="number" inputmode="numeric" min="1" required placeholder="1000"></label><label>Дата постановления<input name="d" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></label><button class="b">Добавить</button></form></div>';
h+='<div class="card"><h3>Напоминание</h3><form id="fw"><label>Подсвечивать за столько дней до конца скидки<input name="w" type="number" inputmode="numeric" min="1" max="19" value="'+S.warn+'"></label><button class="b s">Сохранить</button></form></div><a class="b" href="https://www.gosuslugi.ru/" target="_blank" rel="noopener">Оплатить на Госуслугах</a>';
$("t-f").innerHTML=h}
function rN(){var q=encodeURIComponent("магазин автозапчастей");
$("t-n").innerHTML='<h2>Рядом</h2><p>Открывает карту с поиском в твоём районе.</p><div class="card"><a class="b" href="https://yandex.ru/maps/?text='+q+'" target="_blank" rel="noopener">Магазины запчастей на Яндекс Картах</a><a class="b s" href="https://www.google.com/maps/search/'+q+'" target="_blank" rel="noopener">Открыть в Google Картах</a></div><div class="card"><h3>Скоро</h3><p>Партнёрские магазины со скидками, типичные болячки модели по пробегу, ИИ-помощник и подбор ОСАГО. Сейчас это прототип: данные хранятся только на твоём телефоне.</p></div>'}
function sel(){var s=$("cs");s.innerHTML=S.cars.map(function(c){return'<option value="'+c.id+'"'+(c.id===S.cur?" selected":"")+'>'+esc(c.name)+'</option>'}).join("");s.style.display=S.cars.length?"":"none"}
function all(){sel();rG();rS();rF();rN()}
document.addEventListener("submit",function(e){e.preventDefault();var d=e.target,f=d.id,c=cur();
if(f==="fk"){var v=+d.elements.k.value;if(v<c.km&&!confirm("Пробег меньше текущего. Всё равно обновить?"))return;c.km=v}
else if(f==="fa"){var k=+d.elements.k.value,id=Date.now();S.cars.push({id:id,name:d.elements.n.value.trim(),year:d.elements.y.value,km:k,km0:k,t0:Date.now(),monthly:+d.elements.m.value||1000,cl:d.elements.c.value,svc:{}});S.cur=id}
else if(f==="ff"){S.fines.push({id:Date.now(),sum:+d.elements.s.value,date:d.elements.d.value})}
else if(f==="fw"){S.warn=Math.min(19,Math.max(1,+d.elements.w.value||5))}
save();all()});
document.addEventListener("click",function(e){var b=e.target.closest("[data-a],[data-t]");if(!b)return;
if(b.dataset.t){document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.id==="t-"+b.dataset.t)});document.querySelectorAll("#nv button").forEach(function(x){x.classList.toggle("on",x===b)});scrollTo(0,0);return}
var a=b.dataset.a,c=cur();
if(a==="tip"){S.tip=1}
else if(a==="delcar"){if(!confirm("Удалить «"+c.name+"»?"))return;S.cars=S.cars.filter(function(x){return x.id!==c.id});S.cur=S.cars.length?S.cars[0].id:null}
else if(a==="mark"){var k=b.dataset.k,v=prompt("При каком пробеге это делали в последний раз? Оставь пустым, если сделал сейчас.",c.km);if(v===null)return;
var km=v===""?c.km:Math.min(c.km,Math.max(0,+v||c.km));c.svc[k]={km:km,t:Date.now()-(c.km-km)/(mo(c)||1)*30.4*D}}
else if(a==="delfine"){S.fines=S.fines.filter(function(x){return String(x.id)!==b.dataset.k})}
save();all()});
$("cs").addEventListener("change",function(){S.cur=+this.value;save();all()});
all();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
</body>
</html>
